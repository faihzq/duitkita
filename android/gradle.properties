# Flutter's template asks for -Xmx8G -XX:MaxMetaspaceSize=4G. That is up to
# 12G of reservation, which this 17G machine cannot honour once an IDE and
# an analyzer are resident: the daemon dies with "Native memory allocation
# (mmap) failed ... G1 virtual space" partway through assembleRelease.
# 4G of heap builds this app comfortably; metaspace never approaches 1G.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
