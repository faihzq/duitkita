function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function draw(icon) {
  const c = document.getElementById("c");
  const ctx = c.getContext("2d");
  const W = 1024, H = 500;

  // Background: same 135deg navy ramp as the app header.
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, "#0B1F3A");
  g.addColorStop(0.55, "#11264A");
  g.addColorStop(1, "#16305C");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Teal glows, kept to the right so they never sit behind the text.
  for (const [cx, cy, rad] of [[985, -30, 300], [1020, 470, 230]]) {
    const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
    rg.addColorStop(0, "rgba(0,194,168,0.30)");
    rg.addColorStop(1, "rgba(0,194,168,0)");
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.fill();
  }

  // Icon, rounded to match Android's squircle-ish mask.
  const IS = 168, ix = 84, iy = (H - IS) / 2;
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.45)"; ctx.shadowBlur = 60; ctx.shadowOffsetY = 24;
  roundRect(ctx, ix, iy, IS, IS, 40); ctx.fill();
  ctx.restore();
  ctx.save();
  roundRect(ctx, ix, iy, IS, IS, 40); ctx.clip();
  ctx.drawImage(icon, ix, iy, IS, IS);
  ctx.restore();

  // Text column.
  const tx = ix + IS + 52;
  let y = 138;
  ctx.textBaseline = "top";

  ctx.fillStyle = "#ffffff";
  ctx.font = "800 68px Manrope, sans-serif";
  if ("letterSpacing" in ctx) ctx.letterSpacing = "-1.6px";
  ctx.fillText("DuitKita", tx, y);
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
  y += 82;

  ctx.fillStyle = "#00C2A8";
  roundRect(ctx, tx, y, 64, 5, 3); ctx.fill();
  y += 21;

  ctx.fillStyle = "#E8EEF7";
  ctx.font = "700 25px Manrope, sans-serif";
  ctx.fillText("Track group savings, shared bills", tx, y);   y += 34;
  ctx.fillText("and debts — and plan trips together.", tx, y); y += 52;

  // Feature pills.
  ctx.font = "700 15px Manrope, sans-serif";
  let px = tx;
  for (const label of ["Savings groups", "Bills & debts", "Trip planner"]) {
    const w = ctx.measureText(label).width + 32;
    ctx.fillStyle = "rgba(0,194,168,0.10)";
    roundRect(ctx, px, y, w, 36, 18); ctx.fill();
    ctx.strokeStyle = "rgba(0,194,168,0.45)"; ctx.lineWidth = 1.5;
    roundRect(ctx, px, y, w, 36, 18); ctx.stroke();
    ctx.fillStyle = "#9FF0E2";
    ctx.fillText(label, px + 16, y + 10);
    px += w + 10;
  }
}

const img = new Image();
img.onload = () => {
  // Wait for Manrope, or the first paint falls back to a system font.
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => draw(img));
};
img.src = ICON;

document.getElementById("dl").onclick = () => {
  document.getElementById("c").toBlob(b => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "feature_graphic.png";
    a.click();
  }, "image/png");
};
