<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>DuitKita — Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; height: 100%; background: #1a1f2e; font-family: Manrope, system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; overflow: hidden; }
  #stage { display: flex; align-items: center; justify-content: center; gap: 32px; }
  .device {
    width: 412px; height: 892px;
    border-radius: 38px; overflow: hidden;
    background: #fff; position: relative;
    border: 8px solid #1d242e;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1.5px rgba(255,255,255,0.05) inset;
  }
  .device.dark { background: #070C18; }
  .label { color: rgba(255,255,255,0.5); font-size: 12px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; text-align: center; margin-top: 14px; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  ::-webkit-scrollbar { width: 0; height: 0; }
  button { font-family: Manrope, system-ui, sans-serif; }
  input { font-family: Manrope, system-ui, sans-serif; }
</style>
</head>
<body>
  <div id="stage">
    <div>
      <div id="root" class="device"></div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="theme.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="screens/onboarding.jsx"></script>
  <script type="text/babel" src="screens/main.jsx"></script>
  <script type="text/babel" src="screens/new_expense.jsx"></script>
  <script type="text/babel" src="screens/add_payment.jsx"></script>
  <script type="text/babel" src="screens/expense_approval.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
  <script type="text/babel">
    setTimeout(() => {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App/>);
    }, 80);
  </script>
</body>
</html>
