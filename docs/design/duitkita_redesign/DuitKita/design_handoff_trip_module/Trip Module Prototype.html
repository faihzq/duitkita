<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

  html,body{margin:0;padding:0;height:100%;font-family:Manrope,system-ui,sans-serif;background:#E9ECF2}
  a{color:#008C7A}a:hover{color:#00C2A8}

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  <script type="text/babel" src="home-redesign/base.jsx"></script>

  <script type="text/babel">
    const Frame = ({ children }) => (
      <div style={{ width: 402, height: 858, borderRadius: 46, background: C.bg, position: 'relative', overflow: 'hidden', border: '9px solid #10151F', boxShadow: '0 40px 90px rgba(11,25,50,0.30), 0 0 0 1.5px rgba(255,255,255,0.04) inset' }}>
        <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column' }}>{children}</div>
      </div>
    );
    setTimeout(() => {
      ReactDOM.createRoot(document.getElementById('root')).render(
